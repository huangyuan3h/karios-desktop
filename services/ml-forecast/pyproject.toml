[project]
name = "ml-forecast"
version = "0.1.0"
description = "N-day trend forecast — PyTorch time series (TCN/LSTM) for Karios"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "psycopg[binary]>=3.2.10",
    "python-dotenv>=1.1.1",
    "pyarrow>=15.0.0",
    "tqdm>=4.66.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]
