# nginx.conf for Karios Desktop static export
#
# Serves the Next.js static export (out/) at /.
# Reverse-proxies:
#   /api/*  -> http://data-sync:4330/* (FastAPI)
#   /ai/*   -> http://ai-service:4310/* (Hono)
#
# Browser bundle uses NEXT_PUBLIC_DATA_SYNC_BASE_URL and NEXT_PUBLIC_AI_BASE_URL
# (set at build time). nginx only proxies server-side requests for SSR-style
# fetches and image optimization; the static bundle handles most calls from the
# browser directly via those public URLs.

server {
    listen 8080;
    server_name _;

    # Static export — serve files directly, fall back to index.html for SPA routes.
    root /usr/share/nginx/html;
    index index.html;

    # Long-lived cache for hashed assets.
    location ~* ^/_next/static/.*\.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every other path falls through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Reverse-proxy: data-sync FastAPI.
    # Browser bundle uses NEXT_PUBLIC_DATA_SYNC_BASE_URL for fetch; nginx
    # only sees server-side or same-origin requests.
    location /api/ {
        proxy_pass http://data-sync:4330/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Reverse-proxy: ai-service Hono.
    location /ai/ {
        proxy_pass http://ai-service:4310/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Health endpoint for the Compose healthcheck + scripts.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Hide nginx version from responses.
    server_tokens off;

    # Sensible gzip for text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
}